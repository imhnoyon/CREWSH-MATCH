{% extends 'base.html' %}
{% block title %}Inbox{% endblock title %}
{% block content %}
<div class="row">
    <div class="col-md-12 col-lg-12 mb-3">
        <h3 class="mb-3">Your Inbox</h3>
        <hr class="">
        <ul class="list-group">
            {% for chat in inboxes %}
            <li class="list-group-item list-group-flush mb-2">
                <a class="text-decoration-none text-dark" href="{% url 'chat' chat.inbox_id %}">{{chat.inbox_id}}</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock content %}
